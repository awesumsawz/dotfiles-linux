general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

# Dim screen brightness - faster on battery
listener {
    timeout = 150                                # 2.5min on battery, 5min on AC
    on-timeout = if cat /sys/class/power_supply/BAT*/status 2>/dev/null | grep -q Discharging; then brightnessctl -s set 10; elif [ $(( $(date +%s) - $(stat -c %Y /sys/class/power_supply/BAT*/status 2>/dev/null || echo 0) )) -gt 300 ]; then brightnessctl -s set 10; fi
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# Turn off keyboard backlight - faster on battery
listener {
    timeout = 150                                          # 2.5min on battery, 5min on AC
    on-timeout = if cat /sys/class/power_supply/BAT*/status 2>/dev/null | grep -q Discharging; then brightnessctl -sd rgb:kbd_backlight set 0; elif [ $(( $(date +%s) - $(stat -c %Y /sys/class/power_supply/BAT*/status 2>/dev/null || echo 0) )) -gt 300 ]; then brightnessctl -sd rgb:kbd_backlight set 0; fi
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

# Lock screen - faster on battery
listener {
    timeout = 180                                 # 3min
    on-timeout = if cat /sys/class/power_supply/BAT*/status 2>/dev/null | grep -q Discharging; then loginctl lock-session; fi
}

listener {
    timeout = 600                                 # 10min on AC
    on-timeout = if ! cat /sys/class/power_supply/BAT*/status 2>/dev/null | grep -q Discharging; then loginctl lock-session; fi
}

# Screen off - faster on battery
listener {
    timeout = 210                                 # 3.5min on battery
    on-timeout = if cat /sys/class/power_supply/BAT*/status 2>/dev/null | grep -q Discharging; then hyprctl dispatch dpms off; fi
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 630                                 # 10.5min on AC
    on-timeout = if ! cat /sys/class/power_supply/BAT*/status 2>/dev/null | grep -q Discharging; then hyprctl dispatch dpms off; fi
    on-resume = hyprctl dispatch dpms on
}

# Suspend - only on battery
listener {
    timeout = 900                                 # 15min on battery
    on-timeout = if cat /sys/class/power_supply/BAT*/status 2>/dev/null | grep -q Discharging; then systemctl suspend; fi
}
